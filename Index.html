<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Naija Unites 3D MOBA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    /* HUD overlay */
    #hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-weight: bold; pointer-events: none; z-index: 10;
    }
    .hud-box {
      background: rgba(0, 0, 0, 0.65); padding: 10px 16px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
    }
    .naira { color: #2ecc71; font-size: 1.2rem; }
    
    /* On-Screen Mobile Joystick & Buttons */
    #controls {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 10;
    }
    .touch-btn {
      width: 70px; height: 70px; border-radius: 50%; background: rgba(230, 126, 34, 0.8);
      border: 3px solid #fff; color: #fff; font-weight: bold; display: flex;
      justify-content: center; align-items: center; pointer-events: auto;
      touch-action: manipulation; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .touch-btn:active { transform: scale(0.92); background: rgba(211, 84, 0, 0.9); }
    #btn-ult { background: rgba(155, 89, 182, 0.85); width: 85px; height: 85px; }

    /* Victory/Defeat Modal */
    #modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 20;
    }
    #modal h1 { font-size: 3rem; margin-bottom: 10px; color: #f1c40f; }
    #modal p { font-size: 1.2rem; margin-bottom: 20px; }
    .btn-main {
      padding: 12px 28px; background: #27ae60; border: none; color: #fff;
      font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
  </style>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div class="hud-box">
      <div>HERO: <span id="hero-name" style="color: #3498db;">Hero #1</span></div>
      <div>HP: <span id="hp-val">1000 / 1000</span></div>
    </div>
    <div class="hud-box">
      <div class="naira">₦<span id="wallet">50,000</span></div>
      <div>Dungeon Floor: <span id="floor">1 / 200</span></div>
    </div>
  </div>

  <div id="controls">
    <div id="joystick-zone" style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">
      [Tap Screen or Use WASD / Arrow Keys]
    </div>
    <div style="display: flex; gap: 15px; align-items: flex-end;">
      <button class="touch-btn" id="btn-attack" onclick="triggerAttack()">ATTACK</button>
      <button class="touch-btn" id="btn-ult" onclick="triggerUltimate()">ULTIMATE</button>
    </div>
  </div>

  <div id="modal">
    <h1 id="modal-title">DUNGEON RAID</h1>
    <p id="modal-desc">Defeat 200 Bosses and earn Naira (₦) rewards!</p>
    <button class="btn-main" onclick="startGame()">START BATTLE</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- GAME ENGINE SETUP ---
    let scene, camera, renderer, player, boss, floorMesh;
    let playerHP = 1000, maxHP = 1000;
    let bossHP = 2500, maxBossHP = 2500;
    let currentFloor = 1;
    let walletNaira = 50000;
    let isPlaying = false;

    // Procedural Generator Setup (Generates 1000 Heroes & 200 Bosses dynamically)
    function getHeroStats(id) {
      const colors = [0x3498db, 0xe74c3c, 0x2ecc71, 0x9b59b6, 0xf1c40f, 0x1abc9c];
      return {
        name: `Champion #${id}`,
        color: colors[id % colors.length],
        attack: 80 + (id % 50) * 5,
        speed: 0.15 + (id % 10) * 0.01
      };
    }

    function getBossStats(floor) {
      const colors = [0xe74c3c, 0x8e44ad, 0xd35400, 0xc0392b, 0x2c3e50];
      return {
        name: `Dungeon Overlord V${floor}`,
        color: colors[floor % colors.length],
        hp: 2000 + (floor * 500),
        reward: floor * 15000 // Rewards in Naira (₦)
      };
    }

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111122);
      scene.fog = new THREE.FogExp2(0x111122, 0.03);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 15, 20);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Arena Floor
      const floorGeo = new THREE.CylinderGeometry(15, 15, 1, 32);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });
      floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.position.y = -0.5;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      // Spawn Player Character
      const hero = getHeroStats(1);
      const pGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
      const pMat = new THREE.MeshStandardMaterial({ color: hero.color, metalness: 0.3 });
      player = new THREE.Mesh(pGeo, pMat);
      player.position.set(0, 1, 5);
      player.castShadow = true;
      scene.add(player);

      // Spawn Boss
      spawnBoss(currentFloor);

      window.addEventListener('resize', onWindowResize);
      setupInput();
      animate();
    }

    function spawnBoss(floor) {
      if (boss) scene.remove(boss);
      const bData = getBossStats(floor);
      bossHP = maxBossHP = bData.hp;

      const bGeo = new THREE.BoxGeometry(2, 3, 2);
      const bMat = new THREE.MeshStandardMaterial({ color: bData.color, roughness: 0.2 });
      boss = new THREE.Mesh(bGeo, bMat);
      boss.position.set(0, 1.5, -5);
      boss.castShadow = true;
      scene.add(boss);

      document.getElementById('floor').innerText = `${floor} / 200`;
    }

    // --- CONTROLS & INPUT ---
    const keys = {};
    function setupInput() {
      window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    }

    function updatePlayerMovement() {
      if (!isPlaying) return;
      const speed = 0.12;
      if (keys['w'] || keys['arrowup']) player.position.z -= speed;
      if (keys['s'] || keys['arrowdown']) player.position.z += speed;
      if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
      if (keys['d'] || keys['arrowright']) player.position.x += speed;

      // Restrict movement within boundary radius
      const dist = Math.sqrt(player.position.x**2 + player.position.z**2);
      if (dist > 13) {
        player.position.x *= 13 / dist;
        player.position.z *= 13 / dist;
      }
    }

    // Combat Mechanics
    function triggerAttack() {
      if (!isPlaying) return;
      const dist = player.position.distanceTo(boss.position);
      if (dist < 4) {
        bossHP -= 150;
        createVisualEffect(boss.position, 0xe74c3c);
        if (bossHP <= 0) winBattle();
      }
    }

    function triggerUltimate() {
      if (!isPlaying) return;
      const dist = player.position.distanceTo(boss.position);
      if (dist < 8) {
        bossHP -= 450;
        createVisualEffect(boss.position, 0x9b59b6);
        if (bossHP <= 0) winBattle();
      }
    }

    function createVisualEffect(pos, color) {
      const pGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const pMat = new THREE.MeshBasicMaterial({ color: color });
      const pMesh = new THREE.Mesh(pGeo, pMat);
      pMesh.position.copy(pos);
      scene.add(pMesh);
      setTimeout(() => scene.remove(pMesh), 200);
    }

    function winBattle() {
      isPlaying = false;
      const reward = getBossStats(currentFloor).reward;
      walletNaira += reward;
      document.getElementById('wallet').innerText = walletNaira.toLocaleString();
      
      document.getElementById('modal-title').innerText = "VICTORY!";
      document.getElementById('modal-desc').innerText = `Boss Defeated! Earned ₦${reward.toLocaleString()}`;
      document.getElementById('modal').style.display = 'flex';
      
      currentFloor = Math.min(200, currentFloor + 1);
    }

    function startGame() {
      document.getElementById('modal').style.display = 'none';
      spawnBoss(currentFloor);
      player.position.set(0, 1, 5);
      playerHP = maxHP;
      isPlaying = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();

      // Simple Boss AI logic
      if (isPlaying && boss) {
        boss.rotation.y += 0.01;
        // Boss follows player slowly
        boss.position.x += (player.position.x - boss.position.x) * 0.005;
        boss.position.z += (player.position.z - boss.position.z) * 0.005;
      }

      renderer.render(scene, camera);
    }

    window.onload = init3D;
  </script>
</body>
  </html>
